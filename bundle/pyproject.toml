# The Claude Desktop bundle project (SPEC §9 *Claude Desktop bundle*).
#
# Desktop downloads its own `uv`, runs plain `uv sync` in this directory, then starts the server
# with `uv run --directory <this dir> consumer-reports-mcp` (manifest.json → mcp_config).
#
# `uv sync` does NOT install this project's own extras — but extras named inside a dependency
# specification are installed normally. That is why `[browser]` is spelled on the dependency
# below rather than declared as an extra here: Desktop users get Playwright (the in-conversation
# sign-in needs it), while people installing the server itself from PyPI stay lean.

[project]
name = "consumer-reports-mcp-bundle"
# The wrapper has no version of its own: scripts/build_bundle.py stamps the server's version
# from the root pyproject.toml here and into manifest.json, so nothing is typed twice.
version = "0"
description = "Claude Desktop bundle wrapper for consumer-reports-mcp"
requires-python = ">=3.12"
# The `==0` pin is a placeholder like `version = "0"`: scripts/build_bundle.py stamps the
# root pyproject.toml version here, so the bundle always installs the release it was built for.
# Desktop's `uv sync` resolves that pin from PyPI at install time, and the build has no network —
# so build the bundle from the released tag, after the publish, never before it.
dependencies = ["consumer-reports-mcp[browser]==0"]
